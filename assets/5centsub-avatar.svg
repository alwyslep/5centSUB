<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">5CentSub avatar</title>
  <desc id="description">A copper five-cent coin with a play button, Japanese to Korean subtitle bubbles, and a cloud.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10223f"/>
      <stop offset="1" stop-color="#285882"/>
    </linearGradient>
    <linearGradient id="coin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd78b"/>
      <stop offset="0.55" stop-color="#d89a48"/>
      <stop offset="1" stop-color="#8a4b1c"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#071425" flood-opacity="0.42"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#background)"/>

  <g fill="none" stroke="#7dd3fc" stroke-linecap="round" stroke-width="14" opacity="0.8">
    <path d="M105 187c0-24 19-43 43-43 9 0 17 2 24 7 8-29 34-50 65-50 37 0 68 30 68 68 0 6-1 12-2 18"/>
    <path d="M303 187h55c26 0 47 21 47 47s-21 47-47 47h-20"/>
  </g>

  <g filter="url(#shadow)">
    <circle cx="256" cy="282" r="142" fill="url(#coin)" stroke="#ffe2a4" stroke-width="10"/>
    <circle cx="256" cy="282" r="119" fill="none" stroke="#8b4c1d" stroke-width="6" opacity="0.7"/>
    <circle cx="256" cy="282" r="101" fill="none" stroke="#ffd98e" stroke-width="5" opacity="0.7"/>
  </g>

  <path d="M232 217c0-12 13-19 24-12l76 45c12 7 12 24 0 31l-76 45c-11 7-24 0-24-12z" fill="#17324f"/>

  <g filter="url(#shadow)">
    <path d="M60 300c0-21 17-38 38-38h77c21 0 38 17 38 38v26c0 21-17 38-38 38h-37l-26 25c-6 6-16 2-16-7v-18c-20-1-36-18-36-38z" fill="#f8fafc"/>
    <text x="136" y="327" fill="#17324f" font-family="Arial, 'Noto Sans JP', sans-serif" font-size="45" font-weight="700" text-anchor="middle">JA</text>
  </g>

  <g filter="url(#shadow)">
    <path d="M299 349c0-21 17-38 38-38h77c21 0 38 17 38 38v26c0 20-16 37-36 38v18c0 9-10 13-16 7l-26-25h-37c-21 0-38-17-38-38z" fill="#ef4444"/>
    <text x="376" y="376" fill="#fff" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="34" font-weight="700" text-anchor="middle">KO</text>
  </g>

  <text x="256" y="476" fill="#fff5dd" font-family="Arial, sans-serif" font-size="42" font-weight="700" letter-spacing="3" text-anchor="middle">5¢ SUB</text>
</svg>
